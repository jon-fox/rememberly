[project]
name = "rememberly"
version = "0.1.0"
description = "A Model Context Protocol server for managing context and chat history"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anysqlite>=0.0.5",
    "boto3>=1.42.4",
    "fastmcp>=2.14.2",
    "httpx>=0.28.1",
    "pandas>=2.3.3",
    "pyjwt>=2.10.1",
    "starlette>=0.50.0",
]
authors = [
    { name = "jfox", email = "jon@foxsolutions.dev" }
]
keywords = ["memory", "context", "chat history", "mcp", "model context protocol", "remembering"]
classifiers = [
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
]

[dependency-groups]
dev = [
    "pydantic-ai>=1.9.0",
    "python-dotenv>=1.2.1",
]

[project.scripts]
rememberly = "mcp_server.server:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp_server"]

[tool.uv.workspace]
members = [
    "mcp_server",
]
