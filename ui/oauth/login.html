<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Rememberly</title>
    <link rel="icon" type="image/png" href="/images/favicon.png">
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-box">
            <header class="auth-header">
                <img src="/images/rememberly.png" alt="Rememberly Logo" class="auth-logo">
                <h1>Rememberly</h1>
                <p class="tagline">Your AI-powered memory companion</p>
            </header>

            <!-- Sign In Form -->
            <div id="signInForm" class="auth-form active">
                <h2>Sign In to Continue</h2>
                <p class="form-subtitle">Sign in to authorize the application</p>
                
                <form id="loginForm">
                    <div class="form-group">
                        <label for="loginEmail">Email</label>
                        <input 
                            type="email" 
                            id="loginEmail" 
                            name="email" 
                            placeholder="you@example.com"
                            required
                            autocomplete="email"
                        >
                    </div>
                    
                    <div class="form-group">
                        <label for="loginPassword">Password</label>
                        <input 
                            type="password" 
                            id="loginPassword" 
                            name="password" 
                            placeholder="••••••••"
                            required
                            autocomplete="current-password"
                        >
                    </div>
                    
                    <button type="submit" class="auth-button">Sign In</button>
                    
                    <div id="loginError" class="error-message"></div>
                </form>
                
                <p class="switch-form">
                    Don't have an account? 
                    <a href="/login.html">Sign up here</a>
                </p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/config.js"></script>
    <script src="/auth.js"></script>
    <script>
        let redirectUrl = null;

        // Get redirect URL from query params
        function getRedirectUrl() {
            const params = new URLSearchParams(window.location.search);
            return params.get('redirect');
        }

        // Check if already logged in
        async function checkAuth() {
            try {
                initSupabase();
                
                const { data: { user }, error } = await supabaseClient.auth.getUser();
                
                if (user && redirectUrl) {
                    // Already logged in, redirect to destination
                    window.location.href = redirectUrl;
                }
            } catch (error) {
                console.error('Auth check error:', error);
            }
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            redirectUrl = getRedirectUrl();
            
            const loginForm = document.getElementById('loginForm');
            const loginError = document.getElementById('loginError');
            
            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                loginError.textContent = '';

                const email = document.getElementById('loginEmail').value;
                const password = document.getElementById('loginPassword').value;

                try {
                    initSupabase();

                    const { data, error } = await supabaseClient.auth.signInWithPassword({
                        email: email,
                        password: password
                    });

                    if (error) throw error;

                    // Redirect to the original destination or consent page
                    if (redirectUrl) {
                        window.location.href = redirectUrl;
                    } else {
                        window.location.href = '/';
                    }

                } catch (error) {
                    console.error('Login error:', error);
                    loginError.textContent = error.message || 'Failed to sign in. Please try again.';
                }
            });

            // Check if already authenticated
            checkAuth();
        });
    </script>
</body>
</html>
