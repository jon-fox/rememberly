<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authorizing - Rememberly</title>
    <link rel="icon" type="image/png" href="/images/favicon.png">
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-box">
            <header class="auth-header">
                <img src="/images/rememberly.png" alt="Rememberly Logo" class="auth-logo">
                <h1>Rememberly</h1>
                <p class="tagline">Your AI-powered memory companion</p>
            </header>

            <div id="loading" style="text-align: center; padding: 40px;">
                <p>Completing authorization...</p>
                <p style="color: #666; font-size: 14px; margin-top: 10px;">You'll be redirected shortly</p>
            </div>

            <div id="error-message" class="error-message" style="display: none; text-align: center; padding: 20px;"></div>
        </div>
    </div>

    <script src="/js/config.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/consent.js"></script>
</body>
</html>
