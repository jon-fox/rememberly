name: Deploy Docker Image to EC2

on:
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to deploy (mcp_server or user_service)'
        required: true
        default: 'mcp_server'
        type: choice
        options:
          - mcp_server
          - user_service
  push:
    branches:
      - main
    paths:
      - 'mcp_server/**'
      - '.github/workflows/deploy-ec2.yml'

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEV_GITHUB_ACTION_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Determine service to deploy
        id: determine-service
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            SERVICE="${{ github.event.inputs.service }}"
          else
            SERVICE="mcp_server"
          fi
          echo "service=$SERVICE" >> $GITHUB_OUTPUT
          echo "Deploying service: $SERVICE"

      - name: Build and push Docker image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          SERVICE: ${{ steps.determine-service.outputs.service }}
        run: |
          cd $SERVICE
          IMAGE_TAG=$(git ls-tree -r HEAD $SERVICE/ | shasum | cut -c1-7)
          
          # Build and push image
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          
          echo "image_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "image_uri=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Get EC2 instance ID from Auto Scaling Group
        id: get-instance
        run: |
          ASG_NAME="rememberly-mcp-asg"
          INSTANCE_ID=$(aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names $ASG_NAME \
            --query 'AutoScalingGroups[0].Instances[?HealthStatus==`Healthy`&&LifecycleState==`InService`].InstanceId | [0]' \
            --output text)
          
          if [ "$INSTANCE_ID" == "None" ] || [ -z "$INSTANCE_ID" ]; then
            echo "No healthy running EC2 instance found in Auto Scaling Group"
            exit 1
          fi
          
          echo "instance_id=$INSTANCE_ID" >> $GITHUB_OUTPUT
          echo "Found EC2 instance: $INSTANCE_ID"
          
          # Quick check if SSM is ready
          echo "Checking SSM agent status..."
          for i in {1..12}; do
            SSM_STATUS=$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
              --query 'InstanceInformationList[0].PingStatus' \
              --output text 2>/dev/null || echo "Unknown")
            
            if [ "$SSM_STATUS" == "Online" ]; then
              echo "Instance is ready for SSM commands!"
              break
            fi
            
            if [ $i -eq 12 ]; then
              echo "Warning: SSM agent not responding. Deployment may fail."
              echo "SSM Status: $SSM_STATUS"
              exit 1
            fi
            
            echo "SSM Status: $SSM_STATUS (waiting... $i/12)"
            sleep 5
          done

      - name: Deploy to EC2
        env:
          INSTANCE_ID: ${{ steps.get-instance.outputs.instance_id }}
          IMAGE_URI: ${{ steps.build-image.outputs.image_uri }}
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          # Create deployment commands as JSON array
          cat > commands.json << EOF
          {
            "InstanceIds": ["$INSTANCE_ID"],
            "DocumentName": "AWS-RunShellScript",
            "Parameters": {
              "commands": [
                "set -e",
                "export AWS_REGION=$AWS_REGION",
                "export IMAGE_URI=$IMAGE_URI",
                "export ECR_REGISTRY=$ECR_REGISTRY",
                "echo 'Getting environment variables from Parameter Store...'",
                "export STORAGE_BUCKET=\$(aws ssm get-parameter --name /rememberly/storage_bucket --query Parameter.Value --output text 2>/dev/null || echo '')",
                "export DYNAMODB_TABLE=\$(aws ssm get-parameter --name /rememberly/dynamodb_table --query Parameter.Value --output text 2>/dev/null || echo '')",
                "export GOOGLE_CLIENT_ID=\$(aws ssm get-parameter --name /rememberly/google_client_id --with-decryption --query Parameter.Value --output text 2>/dev/null || echo '')",
                "export GOOGLE_CLIENT_SECRET=\$(aws ssm get-parameter --name /rememberly/google_client_secret --with-decryption --query Parameter.Value --output text 2>/dev/null || echo '')",
                "export MCP_BASE_URL=\$(aws ssm get-parameter --name /rememberly/mcp_base_url --query Parameter.Value --output text 2>/dev/null || echo '')",
                "echo 'Logging into ECR...'",
                "aws ecr get-login-password --region \$AWS_REGION | docker login --username AWS --password-stdin \$ECR_REGISTRY",
                "echo 'Pulling new image...'",
                "docker pull \$IMAGE_URI",
                "echo 'Stopping old container...'",
                "docker stop rememberly-mcp 2>/dev/null || true",
                "docker rm rememberly-mcp 2>/dev/null || true",
                "echo 'Starting new container...'",
                "docker run -d --name rememberly-mcp --restart unless-stopped -p 8080:8080 -e STORAGE_BUCKET=\$STORAGE_BUCKET -e DYNAMODB_TABLE=\$DYNAMODB_TABLE -e ENVIRONMENT=production -e GOOGLE_CLIENT_ID=\$GOOGLE_CLIENT_ID -e GOOGLE_CLIENT_SECRET=\$GOOGLE_CLIENT_SECRET -e MCP_BASE_URL=\$MCP_BASE_URL -e AWS_DEFAULT_REGION=\$AWS_REGION \$IMAGE_URI",
                "echo 'Waiting for container to start...'",
                "sleep 5",
                "if docker ps | grep -q rememberly-mcp; then echo 'Container deployed successfully!'; docker ps | grep rememberly-mcp; else echo 'Container failed to start!'; docker logs rememberly-mcp; exit 1; fi"
              ]
            }
          }
          EOF
          
          # Send command to EC2 via SSM
          COMMAND_ID=$(aws ssm send-command \
            --cli-input-json file://commands.json \
            --query 'Command.CommandId' \
            --output text)
          
          echo "Command ID: $COMMAND_ID"
          echo "Waiting for deployment to complete..."
          
          # Wait for command to complete
          for i in {1..60}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id $COMMAND_ID \
              --instance-id $INSTANCE_ID \
              --query 'Status' \
              --output text)
            
            if [ "$STATUS" == "Success" ]; then
              echo "Deployment completed successfully!"
              aws ssm get-command-invocation \
                --command-id $COMMAND_ID \
                --instance-id $INSTANCE_ID \
                --query 'StandardOutputContent' \
                --output text
              break
            elif [ "$STATUS" == "Failed" ]; then
              echo "Deployment failed!"
              aws ssm get-command-invocation \
                --command-id $COMMAND_ID \
                --instance-id $INSTANCE_ID \
                --query 'StandardErrorContent' \
                --output text
              exit 1
            fi
            
            echo "Status: $STATUS (attempt $i/60)"
            sleep 5
          done

      - name: Verify deployment
        env:
          INSTANCE_ID: ${{ steps.get-instance.outputs.instance_id }}
        run: |
          # Get container status
          aws ssm send-command \
            --instance-ids $INSTANCE_ID \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["docker ps | grep rememberly-mcp", "docker logs --tail 50 rememberly-mcp"]' \
            --query 'Command.CommandId' \
            --output text

      - name: Deployment complete
        run: |
          echo "EC2 deployment complete!"
          echo "Image: ${{ steps.build-image.outputs.image_uri }}"
          echo "Instance: ${{ steps.get-instance.outputs.instance_id }}"
