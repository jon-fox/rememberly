name: Deploy Website to S3

on:
  push:
    branches:
      - main
    paths:
      - 'ui/**'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEV_GITHUB_ACTION_ROLE }}
          aws-region: us-east-1

      - name: Sync UI files to S3
        run: |
          # Sync files to S3 and delete files that no longer exist in source control
          # --delete flag removes files from S3 that have been deleted from the repo
          aws s3 sync ui/ s3://${{ vars.S3_WEBSITE_BUCKET_NAME }}/ \
            --delete \
            --exclude ".git/*" \
            --exclude ".DS_Store" \
            --cache-control "public, max-age=3600"
          
          # Upload OAuth consent page with correct content type (no .html extension)
          if [ -f "ui/oauth/consent" ]; then
            aws s3 cp "ui/oauth/consent" "s3://${{ vars.S3_WEBSITE_BUCKET_NAME }}/oauth/consent" \
              --content-type "text/html; charset=utf-8" \
              --cache-control "public, max-age=3600"
          fi

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"

      - name: Purge Cloudflare cache
        run: |
          curl -X POST "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'

      - name: Deployment complete
        run: |
          echo "Website deployed successfully!"
          echo "URL: https://rememberly.xyz"
