name: Deploy Website to S3

on:
  push:
    branches:
      - main
    paths:
      - 'ui/**'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEV_GITHUB_ACTION_ROLE }}
          aws-region: us-east-1

      - name: Get S3 bucket name from Terraform outputs
        id: bucket
        run: |
          cd infra
          terraform init -backend-config=backend.tfvars
          BUCKET_NAME=$(terraform output -raw s3_website_bucket_name)
          echo "bucket_name=$BUCKET_NAME" >> $GITHUB_OUTPUT

      - name: Sync UI files to S3
        run: |
          aws s3 sync ui/ s3://${{ steps.bucket.outputs.bucket_name }}/ \
            --delete \
            --exclude ".git/*" \
            --exclude ".DS_Store" \
            --cache-control "public, max-age=3600"

      - name: Get CloudFront distribution ID
        id: cloudfront
        run: |
          cd infra
          DISTRIBUTION_ID=$(terraform output -raw cloudfront_distribution_id)
          echo "distribution_id=$DISTRIBUTION_ID" >> $GITHUB_OUTPUT

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ steps.cloudfront.outputs.distribution_id }} \
            --paths "/*"

      - name: Deployment complete
        run: |
          echo "Website deployed successfully!"
          echo "URL: https://rememberly.xyz"
