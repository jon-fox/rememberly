name: Build and Deploy MCP Lambdas

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEV_GITHUB_ACTION_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Build and push MCP server image
          cd mcp_server
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "image_uri=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT
          
          # Build and push authorizer image
          cd ../infra/authorizer_lambda
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:authorizer-$IMAGE_TAG .
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:authorizer-$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:authorizer-latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:authorizer-$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:authorizer-latest
          echo "authorizer_image_uri=$ECR_REGISTRY/$ECR_REPOSITORY:authorizer-$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform Init
        run: |
          cd infra
          terraform init

      - name: Terraform Plan
        run: |
          cd infra
          terraform plan \
            -var="mcp_lambda_image_uri=${{ steps.build-image.outputs.image_uri }}" \
            -var="authorizer_lambda_image_uri=${{ steps.build-image.outputs.authorizer_image_uri }}" \
            -out=tfplan

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main'
        run: |
          cd infra
          terraform apply -auto-approve tfplan

      - name: Update Lambda function
        run: |
          # Update MCP server Lambda
          FUNCTION_NAME="rememberly-mcp-server"
          aws lambda update-function-code \
            --function-name $FUNCTION_NAME \
            --image-uri ${{ steps.build-image.outputs.image_uri }} || true
          
          # Update authorizer Lambda
          AUTHORIZER_FUNCTION_NAME="rememberly-mcp-authorizer"
          aws lambda update-function-code \
            --function-name $AUTHORIZER_FUNCTION_NAME \
            --image-uri ${{ steps.build-image.outputs.authorizer_image_uri }} || true

      - name: Deployment complete
        run: |
          echo "MCP Lambdas deployed successfully!"
          echo "MCP Server Image: ${{ steps.build-image.outputs.image_uri }}"
          echo "Authorizer Image: ${{ steps.build-image.outputs.authorizer_image_uri }}"
