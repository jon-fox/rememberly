name: Build and Deploy MCP Lambda

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'mcp_server/**'
      - 'user_service/**'
      - '.github/workflows/deploy-lambdas.yml'

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEV_GITHUB_ACTION_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Determine the image tag based on code changes
        run: |
          IMAGE_TAG=$(git ls-tree -r HEAD mcp_server/ | shasum | cut -c1-7)
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

      - name: Build and push Docker image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          # Build and push MCP server image
          cd mcp_server
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:${{ env.IMAGE_TAG }} .
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:${{ env.IMAGE_TAG }} $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:${{ env.IMAGE_TAG }}
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "image_uri=$ECR_REGISTRY/$ECR_REPOSITORY:${{ env.IMAGE_TAG }}" >> $GITHUB_OUTPUT

      - name: Build and push User Service image
        id: build-user-service
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          # Build and push User Service image
          cd user_service
          USER_IMAGE_TAG=$(git ls-tree -r HEAD ../user_service/ | shasum | cut -c1-7)
          docker build -t $ECR_REGISTRY/rememberly-user-service:$USER_IMAGE_TAG .
          docker tag $ECR_REGISTRY/rememberly-user-service:$USER_IMAGE_TAG $ECR_REGISTRY/rememberly-user-service:latest
          docker push $ECR_REGISTRY/rememberly-user-service:$USER_IMAGE_TAG
          docker push $ECR_REGISTRY/rememberly-user-service:latest
          echo "user_service_image_uri=$ECR_REGISTRY/rememberly-user-service:$USER_IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Update Lambda functions
        run: |
          # Update MCP server Lambda
          FUNCTION_NAME="rememberly-mcp-server"
          aws lambda update-function-code \
            --function-name $FUNCTION_NAME \
            --image-uri ${{ steps.build-image.outputs.image_uri }} || true
          
          # Update User Service Lambda
          USER_FUNCTION_NAME="rememberly-user-service"
          aws lambda update-function-code \
            --function-name $USER_FUNCTION_NAME \
            --image-uri ${{ steps.build-user-service.outputs.user_service_image_uri }} || true

      - name: Deployment complete
        run: |
          echo "Lambda deployment complete!"
          echo "MCP Server Image: ${{ steps.build-image.outputs.image_uri }}"
          echo "User Service Image: ${{ steps.build-user-service.outputs.user_service_image_uri }}"
